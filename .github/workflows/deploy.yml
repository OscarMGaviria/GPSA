name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run build
        env:
          VITE_API_LOCALIZACIONES: https://apim-simeva-qa.azure-api.net/maps/geojson/simeva/localizacion
          VITE_API_MUNICIPIOS: https://apim-simeva-qa.azure-api.net/maps/geojson/simeva/municipios

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
